<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error</title>
  <link rel="stylesheet" href="/transitions.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#d97757',
            bg: '#faf9f6',
            ink: '#1f1c19',
            line: '#e5e0d8',
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-bg text-ink min-h-screen flex items-center justify-center px-5">
  <div class="text-center max-w-sm">
    <div class="text-6xl font-bold text-accent mb-2">500</div>
    <h1 class="text-xl font-semibold mb-2">Something went wrong</h1>
    <p class="text-stone-500 mb-8">An unexpected error occurred on our end. Please try again in a moment.</p>
    <div class="flex gap-3 justify-center">
      <button onclick="location.reload()" class="bg-transparent text-ink border border-line rounded-lg px-4 py-2.5 text-sm font-semibold cursor-pointer hover:bg-stone-100">Try again</button>
      <a href="/" class="inline-block bg-accent text-white no-underline rounded-lg px-4 py-2.5 text-sm font-semibold hover:opacity-90">Back to home</a>
    </div>
  </div>

  <footer class="fixed bottom-4 right-6 text-xs text-stone-400">
    &copy; <span id="year"></span> ianchen. All rights reserved.
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
