services:
  postgres:
    image: postgres:16-alpine
    container_name: slidepresenter-postgres
    environment:
      POSTGRES_USER: slidepresenter
      POSTGRES_PASSWORD: slidepresenter
      POSTGRES_DB: slidepresenter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidepresenter"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: slidepresenter-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: slidepresenter-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/slidepresenter-files --ignore-existing;
      mc anonymous set download myminio/slidepresenter-files;
      echo 'Bucket created successfully';
      exit 0;
      "

  app:
    build: .
    container_name: slidepresenter-app
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://slidepresenter:slidepresenter@postgres:5432/slidepresenter
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_BUCKET: slidepresenter-files
      S3_ENDPOINT_URL: http://minio:9000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-change-me}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  minio_data:
  app_data:
